version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: citrine_admin
      POSTGRES_PASSWORD: bc_secure_password
      POSTGRES_DB: citrineos
    volumes:
      - postgres_data:/var/lib/postgresql/data

  citrineos:
    image: citrineos/citrineos-core:latest
    restart: always
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=citrine_admin
      - DB_PASS=bc_secure_password
      - DB_NAME=citrineos
      - OCPP_PORT=8080
    depends_on:
      - db

  load-manager:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"  # Health (/health, /health/detailed)
      - "3003:3003"  # REST API (pricing, deep-link, PV surplus, billing, stations)
    environment:
      - CITRINE_WS_URL=ws://citrineos:8080
      - MAX_SITE_POWER=50
      - ADJUSTMENT_THRESHOLD=5
      - ADJUSTMENT_DELAY=1000
      - MONITORING_INTERVAL=5000
      - DEFAULT_STATION_MAX_POWER_KW=22
      - HEALTH_PORT=3001
      - PRICING_API_PORT=3003
      - PRICING_DEFAULT_PRICE_PER_KWH=0.30
      - PRICING_DEFAULT_IDLE_FEE_PER_MIN=0.05
      - PRICING_CURRENCY=EUR
      - PRICING_TIMEZONE=Europe/Berlin
      - DEEP_LINK_STORE_PATH=/app/data/deep-link-tokens.json
      - BILLING_EXPORT_DIR=/app/exports
      # - KNOWN_STATIONS=CS001,CS002
    depends_on:
      - citrineos
    volumes:
      - load_manager_data:/app/data
      - load_manager_exports:/app/exports

  directus:
    image: directus/directus:latest
    restart: always
    ports:
      - "8055:8055"
    environment:
      KEY: "bc-charge-secret-key-2026"
      SECRET: "bc-charge-ultra-secret-2026"
      DB_CLIENT: "pg"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_DATABASE: "citrineos"
      DB_USER: "citrine_admin"
      DB_PASSWORD: "bc_secure_password"
      ADMIN_EMAIL: "admin@bc-charge.com"
      ADMIN_PASSWORD: "change-this-password"
    depends_on:
      - db

volumes:
  postgres_data:
  load_manager_data:
  load_manager_exports: